<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#24090d">
  <title>My Orders | Maharaja Lounge</title>
  <style>
    :root{--bg:#0b0405;--card:#19090c;--gold:#e2b45a;--cream:#fff1d2;--muted:#ae9c84;--red:#e18b8b}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% -20%,#4b191d 0,transparent 35%),var(--bg);color:var(--cream);font-family:Inter,system-ui,sans-serif}.shell{width:min(920px,calc(100% - 30px));margin:auto}.top{position:sticky;top:0;z-index:10;border-bottom:1px solid #352025;background:#0b0405e8;backdrop-filter:blur(14px)}.topin{height:70px;display:flex;align-items:center;gap:18px}.top a{color:#fff;text-decoration:none}.brand{font:22px Georgia,serif;color:var(--gold);margin:auto}.refresh{border:1px solid #62472d;background:#211013;color:var(--gold);border-radius:9px;padding:8px 11px;cursor:pointer}.hero{padding:45px 0 22px}.hero small{color:var(--gold);letter-spacing:.18em}.hero h1{font:clamp(42px,8vw,72px)/1 Georgia,serif;margin:9px 0}.hero p{color:var(--muted);margin:0}.orders{display:grid;gap:15px;padding-bottom:50px}.order{background:linear-gradient(145deg,#1d0c0f,#120709);border:1px solid #43262b;border-radius:22px;padding:21px}.orderTop{display:flex;justify-content:space-between;gap:12px;align-items:start}.orderNo{color:var(--gold);font-weight:900;font-size:18px}.time{display:block;color:var(--muted);font-size:10px;margin-top:5px}.pill{border:1px solid #73532d;border-radius:999px;padding:7px 10px;color:#f2ce83;font-size:10px;font-weight:900;text-align:center}.pill.bad{border-color:#704046;color:var(--red)}.summary{display:flex;justify-content:space-between;gap:12px;margin:18px 0;color:#d5c3aa}.summary b{color:#fff;white-space:nowrap}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:20px}.step{position:relative;padding-top:22px;color:#625457;font-size:9px}.step:before{content:"";position:absolute;left:0;right:0;top:5px;height:4px;background:#39272a;border-radius:99px}.step.done{color:#fff}.step.done:before{background:var(--gold);box-shadow:0 0 12px #e2b45a55}.note{margin-top:17px;padding:12px;border-radius:12px;background:#231115;color:#cdbba2;font-size:12px;line-height:1.45}.empty{text-align:center;border:1px dashed #594047;border-radius:22px;padding:50px 20px;color:var(--muted)}.empty a{display:inline-block;margin-top:16px;background:var(--gold);color:#2a0b0e;text-decoration:none;border-radius:11px;padding:11px 15px;font-weight:900}.loading{color:var(--muted)}
    @media(max-width:560px){.shell{width:min(100% - 20px,920px)}.topin{height:62px}.brand{font-size:18px}.hero{padding:31px 3px 18px}.order{padding:16px}.steps{gap:3px}.step{font-size:8px}.summary{font-size:12px}}
   .orderMap{display:none;margin-top:15px;border:1px solid #62472d;border-radius:14px;overflow:hidden}.orderMap.show{display:block}.orderMapHead{display:flex;justify-content:space-between;padding:10px 12px;color:var(--gold);font-size:11px}.orderMap iframe{display:block;width:100%;height:280px;border:0}
  </style>
</head>
<body>
  <header class="top"><div class="shell topin"><a href="advanced-menu.html">← Menu</a><span class="brand">♛ Maharaja Lounge</span><button class="refresh" onclick="loadOrders()">Refresh</button></div></header>
  <main class="shell"><section class="hero"><small>LIVE ORDER TRACKING</small><h1>My Orders</h1><p>Track orders placed from this device.</p></section><section class="orders" id="orders"><div class="loading">Loading your recent orders…</div></section></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const sb=window.supabase.createClient('https://iovsriggdldklrvnfxsk.supabase.co','sb_publishable_Oxv7MuL1AsVYra4GzL4kZg_wQxDe3ZX',{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});let loading=false;
    const labels={new:'Order received',waiting_customer:'Waiting for your choice',customer_approved:'Change approved',accepted:'Accepted',preparing:'Preparing',ready:'Ready for rider',ready_for_rider:'Ready for rider',out_for_delivery:'Out for delivery',delivered:'Delivered',rejected:'Rejected',cancelled_by_customer:'Cancelled',delivery_failed:'Delivery issue',returned_to_restaurant:'Returned'};
    function safe(v){return String(v==null?'':v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function progress(status){if(['rejected','cancelled_by_customer','delivery_failed','returned_to_restaurant'].includes(status))return 1;if(status==='delivered')return 5;if(status==='out_for_delivery')return 4;if(['ready','ready_for_rider'].includes(status))return 3;if(['accepted','preparing'].includes(status))return 2;return 1}
    function message(o){let s=o.order_status,m=o.customer_response||{};if(s==='new')return 'The restaurant is checking your order.';if(s==='waiting_customer')return 'The restaurant needs your response for an unavailable item.';if(s==='customer_approved')return 'Your updated order is waiting for restaurant confirmation.';if(s==='accepted'||s==='preparing')return 'The kitchen is preparing your food'+(o.prep_minutes?' • '+o.prep_minutes+' minutes':'')+'.';if(s==='ready'||s==='ready_for_rider')return 'Your food is ready and waiting for the rider.';if(s==='out_for_delivery')return 'Your rider is on the way.';if(s==='delivered')return 'Delivered. Thank you for ordering from Maharaja Lounge.';if(s==='rejected')return 'The restaurant could not accept this order'+(m.rejection_reason?' • '+m.rejection_reason:'')+'.';if(s==='delivery_failed'||s==='returned_to_restaurant')return 'Delivery could not be completed'+(m.delivery_failure_reason?' • '+m.delivery_failure_reason:'')+'.';return labels[s]||'Order status updated.'}
    function render(rows){let box=document.getElementById('orders');if(!rows.length){box.innerHTML='<div class="empty"><b>No orders on this device yet.</b><br>Place an order to see live tracking here.<br><a href="advanced-menu.html">Browse menu →</a></div>';return}box.innerHTML=rows.map(o=>{let p=progress(o.order_status),bad=['rejected','cancelled_by_customer','delivery_failed','returned_to_restaurant'].includes(o.order_status),items=(o.items||[]).map(x=>Number(x.qty)+' × '+safe(x.name)).join(', ');return '<article class="order"><div class="orderTop"><div><span class="orderNo">#'+safe(o.order_number)+'</span><span class="time">'+new Date(o.created_at).toLocaleString()+'</span></div><span class="pill '+(bad?'bad':'')+'">'+safe(labels[o.order_status]||o.order_status)+'</span></div><div class="summary"><span>'+items+'</span><b>AED '+Number(o.total||0).toFixed(2)+'</b></div><div class="steps">'+['Received','Preparing','Ready','On the way','Delivered'].map((x,i)=>'<div class="step '+(i<p&&!bad?'done':(i===0?'done':''))+'">'+x+'</div>').join('')+'</div><div class="note">'+safe(message(o))+'</div><div class="orderMap '+(o.rider_location?'show':'')+'"><div class="orderMapHead"><b>Rider live location</b><span>'+(o.rider_location?'Updated live':'Waiting for rider')+'</span></div><iframe title="Rider location" src="'+(o.rider_location?'https://maps.google.com/maps?q='+Number(o.rider_location.lat)+','+Number(o.rider_location.lng)+'&z=16&output=embed':'')+'"></iframe></div></article>'}).join('')}
    let trackingChannels={};
    function saveRefs(refs){localStorage.setItem('maharajaCustomerOrders',JSON.stringify(refs))}
    function connectTrackers(refs){refs.forEach(ref=>{if(!ref.customer_channel||trackingChannels[ref.customer_channel])return;trackingChannels[ref.customer_channel]=sb.channel(ref.customer_channel).on('broadcast',{event:'order_update'},msg=>{let p=msg.payload||{},all=JSON.parse(localStorage.getItem('maharajaCustomerOrders')||'[]'),x=all.find(v=>v.customer_channel===ref.customer_channel);if(!x)return;if(p.type==='rider_location')x.rider_location={lat:Number(p.lat),lng:Number(p.lng),accuracy:Number(p.accuracy),updated_at:p.updated_at};if(p.type==='order_status')x.order_status=p.status;if(p.type==='rider_tracking')x.tracking_status=p.status;saveRefs(all);render(all)}).subscribe()})}
    async function loadOrders(){if(loading)return;loading=true;let refs=JSON.parse(localStorage.getItem('maharajaCustomerOrders')||'[]');if(!refs.length){render([]);loading=false;return}render(refs);connectTrackers(refs);let nums=refs.map(x=>x.order_number),result=await sb.from('orders').select('order_number,items,total,order_status,prep_minutes,customer_response,created_at,customer_channel').in('order_number',nums).order('created_at',{ascending:false});if(!result.error&&result.data){let cached=new Map(refs.map(x=>[x.order_number,x]));refs=result.data.filter(x=>cached.get(x.order_number)?.customer_channel===x.customer_channel).map(x=>Object.assign({},cached.get(x.order_number),x));saveRefs(refs);render(refs)}loading=false}
    (function importOrderLink(){let q=new URLSearchParams(location.search),number=q.get('order'),channel=q.get('channel');if(!number||!/^customer_[a-f0-9]{32}$/.test(channel||''))return;let refs=JSON.parse(localStorage.getItem('maharajaCustomerOrders')||'[]');if(!refs.some(x=>x.order_number===number)){refs.unshift({order_number:number,customer_channel:channel,created_at:new Date().toISOString(),items:[],total:0,order_status:'new'});localStorage.setItem('maharajaCustomerOrders',JSON.stringify(refs.slice(0,10)))}})();
    loadOrders();setInterval(loadOrders,8000);
  </script>
</body>
</html>
