<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bill & Checkout | Maharaja Lounge</title><style>
:root{--wine:#270a0e;--gold:#e2b65b;--cream:#fff2d2}*{box-sizing:border-box}body{margin:0;background:#090304;color:var(--cream);font-family:Inter,system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:24px}.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.nav a{color:#fff;text-decoration:none}.brand{font:21px Georgia;color:var(--gold)}h1{font:clamp(38px,6vw,67px) Georgia;margin:12px 0 30px}.grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:18px;align-items:start}.card{background:#18090b;border:1px solid #43262b;border-radius:22px;padding:21px}.card h2{font:27px Georgia;margin:0 0 17px}.line{display:grid;grid-template-columns:60px 1fr auto;gap:11px;align-items:center;border-bottom:1px solid #362025;padding:11px 0}.line img{width:60px;height:55px;object-fit:cover;border-radius:9px}.line small{color:#a99882}.total{display:flex;justify-content:space-between;font-size:21px;padding-top:17px}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:grid;gap:6px}.full{grid-column:1/-1}label{font-size:11px;color:#d6c09d}input,textarea{width:100%;background:#0d0507;border:1px solid #503137;border-radius:11px;padding:12px;color:#fff}textarea{min-height:72px}.receiver{display:flex;gap:8px;margin-bottom:14px}.receiver button,.loc{border:1px solid #76542d;background:#1d0d0f;color:#e5c37f;border-radius:9px;padding:9px;cursor:pointer}.receiver button.on{background:var(--gold);color:#2b0b0e}.locationRow{display:grid;grid-template-columns:1fr auto;gap:8px}.pay{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.pay label{border:1px solid #503137;border-radius:12px;padding:13px;color:#fff}.confirm{width:100%;border:0;border-radius:13px;background:linear-gradient(90deg,#d6a442,#f0cf83);color:#2a100c;padding:15px;font-weight:900;margin-top:17px;cursor:pointer}.success{display:none;text-align:center}.success.show{display:block}.success h2{font:38px Georgia}.success a{display:inline-block;background:var(--gold);color:#2b0b0e;text-decoration:none;border-radius:12px;padding:13px 18px;font-weight:900}@media(max-width:760px){main{padding:15px}.grid{grid-template-columns:1fr}.form,.pay{grid-template-columns:1fr}.full{grid-column:auto}.locationRow{grid-template-columns:1fr}.loc{min-height:42px}}</style></head><body><main><nav class="nav"><a href="advanced-menu.html">← Menu book</a><span class="brand">♛ Maharaja Lounge</span><span>SECURE CHECKOUT</span></nav><section id="checkout"><small style="color:var(--gold);letter-spacing:.2em">BILL & DELIVERY</small><h1>One final step.</h1><div class="grid"><article class="card"><h2>Your bill</h2><div id="bill"></div><div class="total"><span>Total</span><b id="total"></b></div></article><article class="card"><h2>Delivery details</h2><div class="receiver"><button class="on" onclick="receiver(false,this)">For me</button><button onclick="receiver(true,this)">For someone else</button></div><div class="form"><div class="field"><label id="nameLabel">Your name</label><input id="name" placeholder="Full name"></div><div class="field"><label id="phoneLabel">Your mobile</label><input id="phone" placeholder="+971 5X XXX XXXX"></div><div class="field full"><label>Complete delivery address</label><textarea id="address" placeholder="Building, room, street and area"></textarea></div><div class="field full"><label>Google Maps location</label><div class="locationRow"><input id="map" placeholder="Paste a Maps link"><button class="loc" onclick="locationNow()">⌖ Use current location</button></div></div><div class="field full"><label>Delivery note</label><input id="note" placeholder="Example: Call receiver when outside"></div></div><div class="pay"><label><input type="radio" name="pay" value="Cash on delivery" checked> <b>Cash on delivery</b></label><label><input type="radio" name="pay" value="Card on delivery"> <b>Card on delivery</b></label></div><button class="confirm" onclick="confirmOrder()">Review & confirm order →</button></article></div></section><section class="card success" id="success"><div style="font-size:50px;color:var(--gold)">✓</div><h2>Order confirmed</h2><p>The structured order is ready for the restaurant dashboard.</p><a href="advanced-counter.html">Open hotel dashboard →</a></section></main><script>
let cart=JSON.parse(localStorage.getItem('maharajaCart')||'[]'),other=false;function draw(){if(!cart.length){location.href='advanced-menu.html';return}document.getElementById('bill').innerHTML=cart.map(x=>'<div class="line"><img src="'+x.img+'" alt=""><span><b>'+x.qty+' × '+x.name+'</b><br><small>AED '+x.price.toFixed(2)+' each</small></span><b>AED '+(x.qty*x.price).toFixed(2)+'</b></div>').join('');document.getElementById('total').textContent='AED '+(cart.reduce((a,x)=>a+x.price*x.qty,0)+5).toFixed(2)}
function receiver(v,b){other=v;document.querySelectorAll('.receiver button').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById('nameLabel').textContent=v?'Receiver name':'Your name';document.getElementById('phoneLabel').textContent=v?'Receiver mobile':'Your mobile'}
function locationNow(){if(!navigator.geolocation)return alert('Location is not supported');navigator.geolocation.getCurrentPosition(p=>{document.getElementById('map').value='https://maps.google.com/?q='+p.coords.latitude.toFixed(6)+','+p.coords.longitude.toFixed(6)},()=>alert('Allow location access or paste a Maps link'))}
function confirmOrder(){let name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),address=document.getElementById('address').value.trim();if(!name||!phone||!address)return alert('Please complete receiver name, mobile and address');let order={id:'ML-'+Math.floor(2000+Math.random()*7000),items:cart,total:cart.reduce((a,x)=>a+x.price*x.qty,0)+5,receiver:name,phone,address,map:document.getElementById('map').value,note:document.getElementById('note').value,payment:document.querySelector('[name=pay]:checked').value,forSomeoneElse:other};localStorage.setItem('maharajaPendingOrder',JSON.stringify(order));document.getElementById('checkout').style.display='none';document.getElementById('success').classList.add('show');localStorage.removeItem('maharajaCart')}draw();</script></body></html>
