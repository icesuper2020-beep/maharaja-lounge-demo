<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rider Tracking | Maharaja Lounge</title><style>:root{--bg:#090304;--card:#18090b;--gold:#e4b95f;--cream:#fff6e2;--muted:#b9aa94;--green:#53c58a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#321014,#090304 52%);color:var(--cream);font-family:Inter,system-ui;display:grid;place-items:center;padding:18px}.card{width:min(480px,100%);background:linear-gradient(145deg,#210c0f,#100608);border:1px solid #684126;border-radius:26px;padding:25px;box-shadow:0 30px 90px #000a}.brand{color:var(--gold);font:20px Georgia}.tag{display:inline-block;margin-top:25px;color:var(--gold);font-size:10px;letter-spacing:.18em}h1{font:43px/1 Georgia;margin:10px 0 13px}p{color:var(--muted);line-height:1.55}.order{margin:18px 0;border:1px solid #43262b;border-radius:15px;padding:14px}.status{display:flex;align-items:center;gap:9px;margin:18px 0}.dot{width:10px;height:10px;border-radius:50%;background:#806f67}.status.live .dot{background:var(--green);box-shadow:0 0 15px var(--green);animation:pulse 1s infinite alternate}.actions button{width:100%;border:1px solid #76542d;border-radius:13px;padding:14px;background:#211013;color:#f0ce88;font-weight:900}.start{background:linear-gradient(90deg,#d7a742,#f1d083)!important;color:#29100c!important;border:0!important}.stop{display:none}.actions.tracking .start{display:none}.actions.tracking .stop{display:block}.privacy{font-size:10px;color:#88796a}@keyframes pulse{to{transform:scale(1.25)}}</style></head><body><main class="card"><div class="brand">♛ Maharaja Lounge</div><span class="tag">DELIVERY PARTNER</span><h1>Share live location</h1><p>Start after collecting the order. Keep this page open during delivery.</p><div class="order" id="order">Order</div><div class="status" id="status"><span class="dot"></span><b id="statusText">Tracking has not started</b></div><div class="actions" id="actions"><button class="start" onclick="startTracking()">Start live tracking</button><button class="stop" onclick="stopTracking()">Stop tracking</button></div><p class="privacy" id="detail">Your precise location is shared only with this order's customer and authenticated restaurant manager after you allow GPS.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const q=new URLSearchParams(location.search),channelName=q.get('channel')||'',orderId=q.get('order')||'Current order',valid=/^customer_[a-f0-9]{32}$/.test(channelName);
const client=window.supabase.createClient('https://iovsriggdldklrvnfxsk.supabase.co','sb_publishable_Oxv7MuL1AsVYra4GzL4kZg_wQxDe3ZX',{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
let channel=valid?client.channel(channelName):null,watchId=null,lastSent=0,ready=false;if(channel)channel.subscribe(s=>ready=s==='SUBSCRIBED');document.getElementById('order').textContent='Order '+orderId;
async function broadcast(payload){if(!channel)return;if(!ready)await new Promise(r=>setTimeout(r,900));return channel.send({type:'broadcast',event:'order_update',payload})}
function startTracking(){if(!valid)return alert('This tracking link is invalid.');if(!navigator.geolocation)return alert('Live GPS is not supported.');document.getElementById('statusText').textContent='Waiting for GPS permission…';watchId=navigator.geolocation.watchPosition(async p=>{let now=Date.now();if(now-lastSent<5000)return;lastSent=now;document.getElementById('status').classList.add('live');document.getElementById('statusText').textContent='Live location is sharing';document.getElementById('actions').classList.add('tracking');document.getElementById('detail').textContent='Accuracy: about '+Math.round(p.coords.accuracy)+' metres · Keep this page open';await broadcast({type:'rider_location',lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy,updated_at:new Date().toISOString(),order:orderId})},e=>document.getElementById('statusText').textContent=e.code===1?'Please allow location permission':'Could not get GPS location',{enableHighAccuracy:true,maximumAge:3000,timeout:15000});broadcast({type:'order_status',status:'out_for_delivery'})}
function stopTracking(){if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;broadcast({type:'rider_tracking',status:'stopped'});document.getElementById('status').classList.remove('live');document.getElementById('statusText').textContent='Tracking stopped';document.getElementById('actions').classList.remove('tracking');document.getElementById('detail').textContent='You can restart if delivery is still active.'}
</script></body></html>
